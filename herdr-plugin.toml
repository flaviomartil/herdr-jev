# Herdr plugin manifest for Herdr-Jev.
#
# Install:  herdr plugin link .
# List:     herdr plugin action list --plugin herdr-jev

id = "herdr-jev"
name = "Herdr Jev"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Jev-driven multi-model triage and triad orchestration (Advisor -> Implementer -> Reviewer)"
platforms = ["linux", "macos"]

[[panes]]
id = "assistant"
title = "Jev Lantern"
placement = "tab"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/assistant.sh\""]

[[panes]]
id = "overview"
title = "Jev Radar"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/overview.sh\""]

[[panes]]
id = "office"
title = "Jev Office"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/office.sh\""]

[[actions]]
id = "assistant"
title = "Jev: Lantern assistant"
description = "Control existing work through chat and Jev routing"
contexts = ["global"]
command = ["env", "HERDR_JEV_PLACEMENT=tab", "bash", "herdr-plugin/open-pane.sh", "assistant"]

[[actions]]
id = "overview"
title = "Jev: Radar overview"
description = "Project, worktree branch, status and weekly quota without model calls"
contexts = ["global"]
command = ["env", "HERDR_JEV_PLACEMENT=tab", "bash", "herdr-plugin/open-pane.sh", "overview"]

[[actions]]
id = "office"
title = "Jev: Office view"
description = "Floor plan of active agents, desks, and Jev telemetry"
contexts = ["global"]
command = ["env", "HERDR_JEV_PLACEMENT=tab", "bash", "herdr-plugin/open-pane.sh", "office"]

[[panes]]
id = "route"
title = "Route a task (Jev)"
placement = "overlay"
command = ["bash", "herdr-plugin/route.sh"]

[[panes]]
id = "triad"
title = "Run Triad pipeline (Jev)"
placement = "overlay"
command = ["bash", "herdr-plugin/triad.sh"]

[[panes]]
id = "status"
title = "Herdr-Jev status"
placement = "overlay"
command = ["bash", "herdr-plugin/status.sh"]

[[panes]]
id = "models"
title = "Models and Cascades (/models)"
placement = "overlay"
command = ["bash", "herdr-plugin/models.sh"]

[[actions]]
id = "route"
title = "Jev: Route a task"
description = "Prompt for a task, triage with Jev, and launch chosen agent in a new pane"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "route"]

[[actions]]
id = "triad"
title = "Jev: Full Triad pipeline"
description = "Launch complete Triad pipeline (Advisor -> Implementer -> Reviewer)"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "triad"]

[[actions]]
id = "status"
title = "Jev: Status"
description = "Show TypeSafe Jev API, Herdr and AI-Harness connection status"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "status"]

[[actions]]
id = "models"
title = "Jev: Models (/models)"
description = "Inspect models, check fallback chains, and auto-classify new models via Jev"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "models"]

[[actions]]
id = "routines-status"
title = "Jev: Routines status"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "herdr-routines.status"]

[[actions]]
id = "routines-list"
title = "Jev: Routines list"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "herdr-routines.list"]

[[actions]]
id = "routines-validate"
title = "Jev: Routines validate"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "herdr-routines.validate"]

[[actions]]
id = "routines-start"
title = "Jev: Routines start"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "herdr-routines.start"]

[[actions]]
id = "routines-stop"
title = "Jev: Routines stop"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "herdr-routines.stop"]

[[panes]]
id = "studio-shell"
title = "Jev Studio shell"
placement = "split"
command = ["sh", "-c", "exec \"${SHELL:-/bin/bash}\" -i"]

[[panes]]
id = "session-resume"
title = "Jev session"
placement = "tab"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/companions.sh\" resume"]

[[actions]]
id = "studio"
title = "Jev: Studio layout"
contexts = ["pane"]
command = ["bash", "herdr-plugin/companions.sh", "studio"]

[[actions]]
id = "studio-review"
title = "Jev: Studio review"
contexts = ["pane"]
command = ["bash", "herdr-plugin/companions.sh", "review"]

[[actions]]
id = "studio-off"
title = "Jev: Studio automatic review off"
contexts = ["pane"]
command = ["bash", "herdr-plugin/companions.sh", "studio-off"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "herdr-plugin/companions.sh", "event"]

[[panes]]
id = "sessions"
title = "Jev sessions"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/companions.sh\" sessions"]

[[panes]]
id = "pending"
title = "Jev pending work"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/herdr-plugin/companions.sh\" pending"]

[[actions]]
id = "sessions"
title = "Jev: Search and resume sessions"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "sessions"]

[[actions]]
id = "pending"
title = "Jev: Pending work and source conversations"
contexts = ["global"]
command = ["bash", "herdr-plugin/open-pane.sh", "pending"]

[[actions]]
id = "remote-status"
title = "Jev: Remote Telegram status"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "permgps.telegram-agents.status"]

[[actions]]
id = "remote-doctor"
title = "Jev: Remote Telegram diagnostics"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "permgps.telegram-agents.doctor"]

[[actions]]
id = "remote-setup"
title = "Jev: Remote Telegram setup"
contexts = ["global"]
command = ["herdr", "plugin", "action", "invoke", "permgps.telegram-agents.setup"]
